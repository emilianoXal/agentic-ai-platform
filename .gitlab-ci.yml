# =============================================================================
# Pipeline de infraestructura — Bot ciudadano de infraestructura urbana (urbanbot)
# Repo: hackaton-aws-cds-agentic-ai/agentic-ai-platform
#
# Solo infra (Terraform). Autenticacion AWS via OIDC (GitLab id_tokens -> STS
# AssumeRoleWithWebIdentity). Layout de Terraform: envs/<env>/ (state aislado
# por entorno sobre el mismo bucket con native locking).
#
# Variables requeridas a nivel de proyecto (Settings > CI/CD > Variables):
#   AWS_ROLE_ARN      Rol OIDC de despliegue del agente (uno por agente).
#   TF_STATE_BUCKET   Bucket S3 del estado de Terraform (ya existe, versioning ON).
#
# Variables opcionales (override al lanzar el pipeline):
#   TF_ENV       Entorno a operar: dev | qa | prod   (default: dev)
#   TF_TARGET    Lista separada por comas de recursos a targetear en plan.
#   TF_DESTROY   "true" habilita el job manual de destroy.
# =============================================================================
# Push a rama con MR abierto: solo el pipeline del MR. Evita dos terraform plan
# contra el mismo state lock (rama + MR). main, tags y pipelines manuales
# (web/api, p. ej. con TF_TARGET o TF_UNTAINT_TARGET) siguen corriendo.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - tf_validate
  - app_build
  - tf_plan
  - tf_apply
  - smoke
  - app_deploy

variables:
  GIT_STRATEGY: "clone"
  GIT_DEPTH: "0"
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_DEFAULT_REGION: "us-east-1"
  # Entorno objetivo. dev por defecto; qa/prod se lanzan seteando TF_ENV.
  TF_ENV: "dev"
  # Raiz de Terraform por entorno.
  TF_ROOT: "${CI_PROJECT_DIR}/envs/${TF_ENV}"
  # Backend de estado (S3 native locking, sin DynamoDB).
  # TF_STATE_BUCKET NO tiene default aqui: se define como variable de proyecto
  # en CI/CD > Variables. El bucket ya existe con versioning ON.
  # Version de Terraform pineada (evita drift de :latest).
  TF_VERSION: "1.10"

# =============================================================================
# Autenticacion OIDC compartida por todos los jobs que hablan con AWS.
# =============================================================================
.aws_auth: &aws_auth
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.xalcloud.com/
  before_script:
    - echo "Configurando credenciales AWS via OIDC..."
    - |
      STS_RESPONSE=$(aws sts assume-role-with-web-identity \
        --role-arn "${AWS_ROLE_ARN}" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600)
    - export AWS_ACCESS_KEY_ID=$(echo "$STS_RESPONSE" | jq -r '.Credentials.AccessKeyId')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$STS_RESPONSE" | jq -r '.Credentials.SecretAccessKey')
    - export AWS_SESSION_TOKEN=$(echo "$STS_RESPONSE" | jq -r '.Credentials.SessionToken')
    - aws sts get-caller-identity

# =============================================================================
# Base Terraform: imagen + auth OIDC + init con backend por entorno.
# =============================================================================
.terraform_base:
  <<: *aws_auth
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - apk add --no-cache aws-cli jq
    - !reference [.aws_auth, before_script]
    - echo "Verificando acceso al bucket de estado..."
    - aws s3 ls "s3://${TF_STATE_BUCKET}/" || echo "Warning - No se pudo listar el bucket de estado"
    - cd "${TF_ROOT}"
    - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

terraform:validate:
  extends: .terraform_base
  stage: tf_validate
  script:
    - terraform fmt -check -recursive
    - terraform validate
    - terraform -chdir=../../modules/follow_up init -backend=false -input=false
    - terraform -chdir=../../modules/follow_up test
    - terraform -chdir=../../modules/compute init -backend=false -input=false
    - terraform -chdir=../../modules/compute test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

follow-up:test:
  stage: tf_validate
  image: python:3.12-slim
  script:
    - pip install --quiet -r modules/follow_up/tests/requirements.txt
    - python3 -m pytest -q modules/agent/tests
    - python3 -m pytest -q modules/compute/tests
    - python3 -m pytest -q modules/portal/tests
    - python3 -m pytest -q modules/follow_up/tests/test_ya_quedo.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

media:build:
  stage: app_build
  image: python:3.12-alpine
  script:
    - pip install --requirement modules/compute/layers/pillow/requirements.txt --target modules/compute/layers/pillow/python --platform manylinux2014_x86_64 --implementation cp --python-version 3.12 --only-binary=":all:"
  artifacts:
    paths:
      - modules/compute/layers/pillow/python/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

terraform:plan:
  extends: .terraform_base
  stage: tf_plan
  resource_group: terraform-dev
  script:
    - cd "${TF_ROOT}"
    - |
      TARGET_ARGS=""
      if [ -n "${TF_TARGET:-}" ]; then
        for t in $(echo "$TF_TARGET" | tr ',' ' '); do
          TARGET_ARGS="$TARGET_ARGS -target=$t"
        done
        echo "Plan con targets: $TARGET_ARGS"
      fi
    - terraform plan $TARGET_ARGS -out=tfplan -input=false -lock-timeout=5m
  artifacts:
    paths:
      # El plan guardado congela la ruta y el hash del ZIP del placeholder.
      - ${TF_ROOT}/tfplan
      # El ZIP lo genera el data source archive_file durante el plan y vive en
      # modules/compute/build/ (gitignored). El job de apply corre en otro
      # runner con workspace limpio, asi que hay que pasarlo como artifact o el
      # apply falla con "reading ZIP file ... no such file or directory".
      - ${CI_PROJECT_DIR}/modules/compute/build/
      # Mismo motivo: los ZIPs del modulo agent (seis tools + consumer) los
      # genera archive_file durante el plan en modules/agent/build/.
      - ${CI_PROJECT_DIR}/modules/agent/build/
      # Y los del modulo portal (dashboard_api + stream_publisher).
      - ${CI_PROJECT_DIR}/modules/portal/build/
      - ${CI_PROJECT_DIR}/modules/follow_up/build/
    expire_in: 1 hour
  dependencies:
    - terraform:validate
    - media:build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

terraform:apply:
  extends: .terraform_base
  stage: tf_apply
  resource_group: terraform-dev
  environment:
    name: dev
  script:
    - cd "${TF_ROOT}"
    - terraform apply -auto-approve -input=false -lock-timeout=5m tfplan
  dependencies:
    - terraform:plan
  when: manual
  allow_failure: false
  rules:
    # Los despliegues solo se hacen desde main.
    - if: '$TF_DESTROY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

terraform:destroy:
  extends: .terraform_base
  stage: tf_apply
  script:
    - cd "${TF_ROOT}"
    - terraform destroy -auto-approve -input=false -lock-timeout=5m
  when: manual
  allow_failure: false
  rules:
    - if: '$TF_DESTROY == "true" && $CI_COMMIT_BRANCH == "main"'
      when: manual

# =============================================================================
# Job manual para des-tainting un recurso del state.
#
# Cuando aparece: si un apply crea un recurso en AWS pero falla justo despues
# (post-create step), Terraform lo marca como tainted en state. En los planes
# subsecuentes aparece como '# ... is tainted, so must be replaced', y el
# apply intenta destroy + create que choca con el nombre del recurso original.
#
# Como usar: en la UI de GitLab, "Run pipeline" y setear la variable
#   TF_UNTAINT_TARGET = <resource address, ej. module.data.aws_sqs_queue.ingest>
# Solo aparece el job cuando esa variable esta seteada. El job corre en el
# rol OIDC (con permisos de PutObject al bucket de state, que el rol SSO
# humano intencionalmente no tiene).
# =============================================================================
terraform:untaint:
  extends: .terraform_base
  stage: tf_plan
  script:
    - cd "${TF_ROOT}"
    - |
      if [ -z "${TF_UNTAINT_TARGET:-}" ]; then
        echo "TF_UNTAINT_TARGET no seteada. Ejemplo:"
        echo "  TF_UNTAINT_TARGET=module.data.aws_sqs_queue.ingest"
        exit 1
      fi
    - echo "Des-tainting ${TF_UNTAINT_TARGET}..."
    - terraform untaint -lock-timeout=5m "${TF_UNTAINT_TARGET}"
  when: manual
  allow_failure: false
  rules:
    - if: '$TF_UNTAINT_TARGET != null && $TF_UNTAINT_TARGET != ""'
      when: manual

# =============================================================================
# Job manual para liberar el candado del estado de Terraform.
#
# Cuando aparece: si un apply se cancela o muere a media ejecucion, el objeto
# <key>.tflock (S3 native locking) queda en el bucket y todo plan/apply posterior
# falla por timeout del candado.
#
# Como usar: ANTES confirmar que no hay ningun job de Terraform corriendo.
# Luego, en la UI de GitLab, "Run pipeline" sobre main con la variable
#   TF_FORCE_UNLOCK = true
# El job lee el ID del candado del propio objeto .tflock, lo imprime con quien
# y cuando lo tomo, y ejecuta terraform force-unlock con el rol OIDC (el rol SSO
# humano no puede leer ni borrar el objeto).
# =============================================================================
terraform:force-unlock:
  extends: .terraform_base
  stage: tf_plan
  script:
    - cd "${TF_ROOT}"
    - LOCK_KEY="urbanbot/${TF_ENV}/terraform.tfstate.tflock"
    - |
      if ! aws s3 cp "s3://${TF_STATE_BUCKET}/${LOCK_KEY}" /tmp/tflock.json; then
        echo "No hay candado en s3://${TF_STATE_BUCKET}/${LOCK_KEY}; nada que liberar."
        exit 0
      fi
    - jq '{ID, Operation, Who, Created}' /tmp/tflock.json
    - LOCK_ID=$(jq -r '.ID' /tmp/tflock.json)
    - test -n "${LOCK_ID}" && test "${LOCK_ID}" != "null"
    - terraform force-unlock -force "${LOCK_ID}"
    - echo "Candado ${LOCK_ID} liberado."
  when: manual
  allow_failure: false
  rules:
    - if: '$TF_FORCE_UNLOCK == "true" && $CI_COMMIT_BRANCH == "main"'
      when: manual

# =============================================================================
# Dashboard (apps/dashboard) — Angular officials' dashboard.
#
# dashboard:build corre en MRs y ramas: tests unitarios + build de produccion.
# dashboard:deploy es manual y SOLO en main, despues de terraform:apply:
#   1. Lee los outputs de Terraform del entorno (Cognito, AppSync, Amplify).
#   2. Obtiene el valor de la API key de Amazon Location (geo:DescribeKey).
#   3. Escribe config.json en el build y lo sube como zip a Amplify Hosting.
# =============================================================================
dashboard:build:
  stage: app_build
  image: node:22-alpine
  variables:
    APP_DIR: "${CI_PROJECT_DIR}/apps/dashboard"
  cache:
    key:
      files:
        - apps/dashboard/package-lock.json
    paths:
      - apps/dashboard/.npm/
  script:
    - cd "${APP_DIR}"
    - npm ci --cache .npm --prefer-offline
    - npx ng test --watch=false
    - npx ng build
  artifacts:
    paths:
      - apps/dashboard/dist/dashboard/browser/
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - apps/dashboard/**/*
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - apps/dashboard/**/*
    - if: '$CI_COMMIT_BRANCH == "main"'

dashboard:deploy:
  extends: .terraform_base
  stage: app_deploy
  dependencies:
    - dashboard:build
  script:
    - apk add --no-cache zip curl
    - cd "${TF_ROOT}"
    - OUT=$(terraform output -json)
    - APP_ID=$(echo "$OUT" | jq -r '.portal_dashboard_app_id.value')
    - BRANCH=$(echo "$OUT" | jq -r '.portal_dashboard_branch_name.value')
    - KEY_NAME=$(echo "$OUT" | jq -r '.portal_maps_api_key_name.value')
    - MAPS_KEY=$(aws location describe-key --key-name "$KEY_NAME" --query Key --output text)
    - |
      jq -n \
        --arg region "${AWS_DEFAULT_REGION}" \
        --arg pool "$(echo "$OUT" | jq -r '.portal_user_pool_id.value')" \
        --arg client "$(echo "$OUT" | jq -r '.portal_user_pool_client_id.value')" \
        --arg url "$(echo "$OUT" | jq -r '.portal_graphql_url.value')" \
        --arg key "$MAPS_KEY" \
        '{dataSource: "appsync", region: $region, userPoolId: $pool, userPoolClientId: $client,
          graphqlUrl: $url, mapsApiKey: $key,
          defaultCenter: {lat: 20.5931, lng: -100.3921}, defaultCenterLabel: "Querétaro"}' \
        > "${CI_PROJECT_DIR}/apps/dashboard/dist/dashboard/browser/config.json"
    - cd "${CI_PROJECT_DIR}/apps/dashboard/dist/dashboard/browser" && zip -qr "${CI_PROJECT_DIR}/dashboard.zip" .
    - DEPLOY=$(aws amplify create-deployment --app-id "$APP_ID" --branch-name "$BRANCH")
    - JOB_ID=$(echo "$DEPLOY" | jq -r '.jobId')
    - curl --fail --silent --show-error -T "${CI_PROJECT_DIR}/dashboard.zip" "$(echo "$DEPLOY" | jq -r '.zipUploadUrl')"
    - aws amplify start-deployment --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID"
    - |
      for i in $(seq 1 60); do
        STATUS=$(aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" --query 'job.summary.status' --output text)
        echo "Amplify job ${JOB_ID}: ${STATUS}"
        case "$STATUS" in
          SUCCEED) break ;;
          FAILED|CANCELLED) exit 1 ;;
        esac
        sleep 5
      done
    - echo "Dashboard -> $(cd "${TF_ROOT}" && terraform output -raw portal_dashboard_url)"
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# =============================================================================
# Bedrock smoke test — comprueba la invocacion real del modelo del agente
# (T-0011: "comprobar invocacion Bedrock"). Invoca el inference profile Sonnet
# que usa la Lambda del agente (modules/agent) con un prompt trivial en espanol
# y verifica que Bedrock responde con texto. Manual y solo en main, despues de
# terraform:apply, para validar end-to-end que el acceso a Bedrock + el perfil
# de inferencia + la politica de gobierno permiten la invocacion.
#
# El modelo es el mismo que usa el agente: var.bedrock_model_id en el modulo
# agent (anthropic.claude-sonnet-5-5) a traves del perfil us.*.
# Si se cambia el modelo del agente, actualizar BEDROCK_PROFILE_ID aqui.
# =============================================================================
bedrock:smoke:
  <<: *aws_auth
  stage: tf_apply
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  variables:
    # Perfil de inferencia que invoca el agente (prefijo us.* permitido por la
    # politica de gobierno). Debe coincidir con modules/agent (var.bedrock_model_id).
    BEDROCK_PROFILE_ID: "us.anthropic.claude-sonnet-5-5"
  before_script:
    - apk add --no-cache aws-cli jq
    - !reference [.aws_auth, before_script]
  script:
    - echo "Invocando ${BEDROCK_PROFILE_ID} via bedrock-runtime converse..."
    - |
      aws bedrock-runtime converse \
        --model-id "${BEDROCK_PROFILE_ID}" \
        --region "${AWS_DEFAULT_REGION}" \
        --messages '[{"role":"user","content":[{"text":"Responde solo con la palabra: listo"}]}]' \
        --inference-config '{"maxTokens":16}' \
        > converse.json
    - echo "Respuesta cruda:" && cat converse.json
    - |
      REPLY=$(jq -r '.output.message.content[0].text // empty' converse.json)
      STOP=$(jq -r '.stopReason // empty' converse.json)
      if [ -z "$REPLY" ]; then
        echo "FALLO: Bedrock no devolvio texto (stopReason=${STOP})."
        exit 1
      fi
      echo "OK: Bedrock respondio -> '${REPLY}' (stopReason=${STOP})"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

agent:conversations:
  <<: *aws_auth
  stage: smoke
  image:
    name: python:3.12-alpine
    entrypoint: [""]
  before_script:
    - apk add --no-cache aws-cli jq
    - pip install --quiet boto3
    - !reference [.aws_auth, before_script]
  script:
    - python3 scripts/conversation_matrix.py --output-dir conversation-artifacts
  artifacts:
    when: always
    paths:
      - conversation-artifacts/conversation_matrix.json
      - conversation-artifacts/conversation_matrix.md
    expire_in: 30 days
  timeout: 1h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH =~ /^feat\//'
      when: manual

# =============================================================================
# WhatsApp smoke — publica un envelope EUM ficticio en el SNS inbound de dev
# y espera el log enqueued de la Lambda de ingesta. Manual, despues de apply,
# con el rol OIDC de despliegue (el SSO de lectura niega SNS:Publish a proposito).
# SMOKE_HASTA (dev pipeline variable) avanza consumidor|agente|portal.
# =============================================================================
smoke:whatsapp:
  <<: *aws_auth
  stage: smoke
  image:
    name: python:3.12-alpine
    entrypoint: [""]
  variables:
    SMOKE_HASTA: "ingesta"
  before_script:
    - apk add --no-cache aws-cli jq
    - pip install --quiet boto3
    - !reference [.aws_auth, before_script]
  script:
    - python3 scripts/smoke_whatsapp.py --hasta "${SMOKE_HASTA:-ingesta}"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH'
      when: manual
