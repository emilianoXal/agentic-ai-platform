<div class="fy-map" #map role="region" [attr.aria-label]="'map.aria' | t"></div>

<div class="fy-map-tools">
  <button type="button" class="btn" (click)="fitIncidents()">{{ 'map.showAll' | t }}</button>
  <button type="button" class="btn" (click)="locateMe()">{{ 'map.myLocation' | t }}</button>
</div>

<div class="fy-map-legend" aria-hidden="true">
  <span><i class="fy-size small"></i><i class="fy-size big"></i>{{ 'map.legendSize' | t }}</span>
  <span>{{ 'map.legendColor' | t }}</span>
  <span><i class="fy-esc-dot"></i>{{ 'map.legendEscalated' | t }}</span>
  @if (usingFallbackTiles) {
    <span class="fy-fallback">{{ 'map.fallback' | t }}</span>
  }
</div>
